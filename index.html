<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dayflow</title>
    <style>
        :root {
            --hijau: #2e7d32;
            --biru: #1565c0;
            --oranye: #ef6c00;
            --merah: #c62828;
            --latar: #f5f6f8;
            --permukaan: #ffffff;
            --teks: #1f2328;
            --teks-pudar: #6b7280;
            --garis : #e5e7eb;
        }

        *{
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
            background-color: var(--latar);
            color: var(--teks);
            line-height: 1.5;
        }

        main{
            max-width: 480px;
            margin: 0 auto;
            padding: 16px 16px 88px;
        }

        nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background-color: var(--permukaan);
            border-top: 1px solid var(--garis);
            display: flex;
        }

        nav button.aktif {
            color: var(--biru);
            font-weight: 600;
            box-shadow: inset 0 3px 0 var(--biru);
        }

        .daftar {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-top: 12px;
        }

        .item-tugas {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 8px;
            background-color: var(--permukaan);
            border: 1px solid var(--garis);
            border-radius: 12px;
            padding: 12px 16px;

        }

        .info {
            display: flex;
            flex-direction: column;
        }

        .judul {
            font-weight: 600;
        }

        .meta {
            color: var(--teks-pudar);
            font-size: 0.85rem;
        }

        .prioritas {
            font-size: 0.75rem;
            text-transform: capitalize;
            padding: 2px 10px;
            border-radius: 999px;
        }
        
        .prioritas.tinggi { background: #fdecea; color: var(--merah); }
        .prioritas.sedang { background: #fff3e0; color: var(--oranye); }
        .prioritas.rendah { background: #e8f5e9; color: var(--biru); }

        .item-tugas.selesai .judul {
            text-decoration: line-through;
            color: var(--teks-pudar);
        }

        .kosong {
            color: var(--teks-pudar);
            text-align: center;
            padding: 24px;
        }
        
        .halaman {display:none;}
        .halaman.aktif {display:block;}
    </style>
</head>

<body>

        <main>
            <section id="beranda" class="halaman aktif">
                <h1>Beranda</h1>
                <div class="kartu">
                    <p>Ringkasan hari ini akan tampil disini.</p>
                </div>
            </section>

            <section id ="habit" class="halaman">
                <h1>Habit</h1>
                <div class="kartu">
                    <p>Daftar kebiasaan akan tampil disini.</p>
                </div>
            </section>

            <section id="task" class="halaman">
                <h1>Task</h1>
                <ul id="daftarTugas" class="daftar"></ul>
            </section>

            <section id="finansial" class="halaman">
                <h1>Finansial</h1>
                <div class="kartu">
                    <p>Ringkasan keuangan akan tampil disini.</p>
                </div>  
            </section>
        </main>

        <nav>
            <button data-halaman="beranda" class="aktif">Beranda</button>
            <button data-halaman="habit">Habit</button>
            <button data-halaman="task">Task</button>
            <button data-halaman="finansial">Finansial</button>
        </nav>
    <script>
        const tombolNav =document.querySelectorAll('nav button');
        const semuaHalaman = document.querySelectorAll('.halaman');

        function bukaHalaman(id){
            semuaHalaman.forEach(function (hal){
            hal.classList.remove('aktif')
            });
            document.getElementById(id).classList.add('aktif');

            tombolNav.forEach(function (tombol){
                tombol.classList.toggle("aktif", tombol.dataset.halaman === id);
            })
        }

        tombolNav.forEach(function (tombol){
            tombol.addEventListener('click', function(){
                bukaHalaman(tombol.dataset.halaman);
            });
        });

        let tugas =[
            
        ]

        const daftarTugas = document.getElementById('daftarTugas');

        function tampilkanTugas(){
            daftarTugas.innerHTML = "";

            if(tugas.length === 0){
                const kosong = document.createElement('li');
                kosong.className = "kosong";
                kosong.textContent = "belum ada tugas.";
                daftarTugas.append(kosong);
            }

            tugas.forEach(function (t) {
                const li = document.createElement("li");
                li.className = "item-tugas";
                if (t.selesai) {
                li.classList.add("selesai");
                }

                const info = document.createElement("div");
                info.className = "info";

                const judul = document.createElement("span");
                judul.className = "judul";
                judul.textContent = t.judul;

                const meta = document.createElement("span");
                meta.className = "meta";
                meta.textContent = "Deadline " + t.deadline;

                const label = document.createElement("span");
                label.className = "prioritas " + t.prioritas;
                label.textContent = t.prioritas;

                info.append(judul, meta);
                li.append(info, label);
                daftarTugas.append(li);
            });
        }

        tampilkanTugas();
        
    </script>
</body>
</html>
